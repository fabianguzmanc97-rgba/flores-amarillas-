<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas Especiales 🌻</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fondo de pétalos cayendo suavemente -->
    <div class="falling-petals-container" id="petalsContainer"></div>

    <div class="card">
        <header>
            <h1 id="mainTitle">🌻 Para mis Amores 🌻</h1>
            <p class="subtitle">¡Un detalle con flores amarillas que nunca se marchitan! ✨</p>
        </header>

        <!-- Ramo de Flores SVG Avanzado con Envoltorio de Papel -->
        <div class="bouquet-wrapper">
            <svg class="bouquet-svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#d7ccc8"/>
                        <stop offset="50%" stop-color="#bcaaa4"/>
                        <stop offset="100%" stop-color="#8d6e63"/>
                    </linearGradient>
                    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff80ab"/>
                        <stop offset="100%" stop-color="#f50057"/>
                    </linearGradient>
                    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
                    </filter>
                </defs>

                <!-- Envoltorio de papel KRAFT -->
                <g class="wrapper-group" filter="url(#shadow)">
                    <polygon points="120,380 380,380 310,570 190,570" fill="#a1887f" />
                    <polygon points="110,360 250,570 180,570" fill="#bcaaa4" />
                    <polygon points="390,360 250,570 320,570" fill="#d7ccc8" />
                    <polygon points="140,360 250,550 360,360" fill="url(#wrapperGrad)" />
                </g>

                <!-- Tallos -->
                <g class="stems-group" stroke="#388e3c" stroke-width="9" stroke-linecap="round">
                    <path d="M 250 500 C 240 400, 150 300, 140 210" />
                    <path d="M 250 500 C 245 400, 205 280, 200 160" />
                    <path d="M 250 500 C 255 400, 295 280, 300 160" />
                    <path d="M 250 500 C 260 400, 350 300, 360 210" />
                </g>

                <!-- Hojas verdes -->
                <g fill="#4caf50" opacity="0.95">
                    <path d="M 190 380 Q 130 360 150 330 Q 180 350 190 380" />
                    <path d="M 310 380 Q 370 360 350 330 Q 320 350 310 380" />
                    <path d="M 210 320 Q 160 290 180 270 Q 200 290 210 320" />
                    <path d="M 290 320 Q 340 290 320 270 Q 300 290 290 320" />
                </g>

                <!-- Lazo Rosa -->
                <g class="ribbon-group" filter="url(#shadow)">
                    <path d="M 210 450 Q 250 465 290 450 Q 280 475 250 470 Q 220 475 210 450 Z" fill="url(#ribbonGrad)" />
                    <circle cx="250" cy="458" r="8" fill="#c2185b" />
                    <path d="M 245 462 Q 230 510 215 530 Q 230 515 247 465 Z" fill="#f50057" />
                    <path d="M 255 462 Q 270 510 285 530 Q 270 515 253 465 Z" fill="#d81b60" />
                </g>
            </svg>

            <!-- Flores con las fotos de tus amigas -->
            <div class="flowers-overlay">
                <!-- Flor 1 -->
                <div class="flower-node flower-1" title="Ver foto">
                    <div class="flower-petals">
                        <span style="--i:0;"></span><span style="--i:1;"></span>
                        <span style="--i:2;"></span><span style="--i:3;"></span>
                        <span style="--i:4;"></span><span style="--i:5;"></span>
                        <span style="--i:6;"></span><span style="--i:7;"></span>
                        <span style="--i:8;"></span><span style="--i:9;"></span>
                        <span style="--i:10;"></span><span style="--i:11;"></span>
                    </div>
                    <div class="photo-center">
                        <img id="img-1" src="./images/image1.jpg" alt="Amiga 1">
                    </div>
                </div>

                <!-- Flor 2 -->
                <div class="flower-node flower-2" title="Ver foto">
                    <div class="flower-petals">
                        <span style="--i:0;"></span><span style="--i:1;"></span>
                        <span style="--i:2;"></span><span style="--i:3;"></span>
                        <span style="--i:4;"></span><span style="--i:5;"></span>
                        <span style="--i:6;"></span><span style="--i:7;"></span>
                        <span style="--i:8;"></span><span style="--i:9;"></span>
                        <span style="--i:10;"></span><span style="--i:11;"></span>
                    </div>
                    <div class="photo-center">
                        <img id="img-2" src="./images/image2.jpg" alt="Amiga 2">
                    </div>
                </div>

                <!-- Flor 3 -->
                <div class="flower-node flower-3" title="Ver foto">
                    <div class="flower-petals">
                        <span style="--i:0;"></span><span style="--i:1;"></span>
                        <span style="--i:2;"></span><span style="--i:3;"></span>
                        <span style="--i:4;"></span><span style="--i:5;"></span>
                        <span style="--i:6;"></span><span style="--i:7;"></span>
                        <span style="--i:8;"></span><span style="--i:9;"></span>
                        <span style="--i:10;"></span><span style="--i:11;"></span>
                    </div>
                    <div class="photo-center">
                        <img id="img-3" src="./images/image3.jpg" alt="Amiga 3">
                    </div>
                </div>

                <!-- Flor 4 -->
                <div class="flower-node flower-4" title="Ver foto">
                    <div class="flower-petals">
                        <span style="--i:0;"></span><span style="--i:1;"></span>
                        <span style="--i:2;"></span><span style="--i:3;"></span>
                        <span style="--i:4;"></span><span style="--i:5;"></span>
                        <span style="--i:6;"></span><span style="--i:7;"></span>
                        <span style="--i:8;"></span><span style="--i:9;"></span>
                        <span style="--i:10;"></span><span style="--i:11;"></span>
                    </div>
                    <div class="photo-center">
                        <img id="img-4" src="./images/image4.jpg" alt="Amiga 4">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver la foto ampliada al hacer clic -->
    <div class="modal" id="imageModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Foto ampliada">
    </div>

    <script src="script.js"></script>
</body>
</html>
