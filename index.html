<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas Especiales 🌻</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fondo de pétalos cayendo -->
    <div class="falling-petals-container" id="petalsContainer"></div>

    <header class="header">
        <h1>Para Mis Amores❤️</h1>
        <p class="subtitle">Las amo!🌻✨</p>
    </header>

    <!-- Ramo de Flores Orgánico Grande -->
    <div class="bouquet-container">
        <!-- Tallos y Hojas SVG -->
        <svg class="stems-svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
            <g stroke="#388e3c" stroke-width="10" stroke-linecap="round" fill="none">
                <path d="M 250 480 C 240 380, 150 280, 140 180" />
                <path d="M 250 480 C 245 360, 205 240, 200 130" />
                <path d="M 250 480 C 255 360, 295 240, 300 130" />
                <path d="M 250 480 C 260 380, 350 280, 360 180" />
            </g>
            <g fill="#4caf50">
                <path d="M 200 360 Q 130 340 150 310 Q 180 330 200 360" />
                <path d="M 300 360 Q 370 340 350 310 Q 320 330 300 360" />
                <path d="M 215 290 Q 160 260 180 240 Q 200 260 215 290" />
                <path d="M 285 290 Q 340 260 320 240 Q 300 260 285 290" />
            </g>
            <!-- Maceta / Envoltorio inferior -->
            <polygon points="200,430 300,430 280,490 220,490" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
            <circle cx="250" cy="450" r="12" fill="#ff4081" />
        </svg>

        <!-- Flores con Pétalos Orgánicos y Tus Fotos -->
        <div class="flowers-layer">
            <!-- Flor 1 -->
            <div class="sunflower flower-1">
                <div class="petals-wrapper">
                    <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
                    <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
                    <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
                    <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
                    <span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
                    <span style="--i:16"></span>
                </div>
                <div class="flower-center">
                    <img src="./images/image1.jpg" alt="Foto 1">
                </div>
            </div>

            <!-- Flor 2 (La más alta) -->
            <div class="sunflower flower-2">
                <div class="petals-wrapper">
                    <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
                    <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
                    <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
                    <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
                    <span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
                    <span style="--i:16"></span>
                </div>
                <div class="flower-center">
                    <img src="./images/image2.jpg" alt="Foto 2">
                </div>
            </div>

            <!-- Flor 3 -->
            <div class="sunflower flower-3">
                <div class="petals-wrapper">
                    <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
                    <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
                    <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
                    <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
                    <span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
                    <span style="--i:16"></span>
                </div>
                <div class="flower-center">
                    <img src="./images/image3.jpg" alt="Foto 3">
                </div>
            </div>

            <!-- Flor 4 -->
            <div class="sunflower flower-4">
                <div class="petals-wrapper">
                    <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
                    <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
                    <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
                    <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
                    <span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
                    <span style="--i:16"></span>
                </div>
                <div class="flower-center">
                    <img src="./images/image4.jpg" alt="Foto 4">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
